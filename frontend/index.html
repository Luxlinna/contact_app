<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContactApp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Chat widget -->
    <script>
    (function(){
      var API = ('%VITE_API_BASE_URL%' !== '%VITE_API_BASE_URL%' ? '%VITE_API_BASE_URL%' : '') || 'http://127.0.0.1:8000';
      var step = 0, visitorName = '', visitorContact = '';

      var css = document.createElement('style');
      css.textContent =
        '#_lw{position:fixed;bottom:24px;right:24px;z-index:2147483647;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:flex-end;gap:12px}'+
        '#_lw_btn{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#0099FF,#A033FF);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,153,255,.5);transition:transform .2s}'+
        '#_lw_btn:hover{transform:scale(1.1)}'+
        '#_lw_panel{display:none;flex-direction:column;width:360px;max-width:calc(100vw - 48px);height:500px;max-height:calc(100vh - 110px);background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.18);overflow:hidden}'+
        '#_lw_panel.open{display:flex;animation:lwIn .25s ease}'+
        '@keyframes lwIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}'+
        '#_lw_hdr{background:linear-gradient(135deg,#0099FF,#A033FF);padding:16px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}'+
        '#_lw_ava{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;flex-shrink:0}'+
        '#_lw_info{flex:1}#_lw_info strong{display:block;color:#fff;font-size:15px;font-weight:700}'+
        '#_lw_online{font-size:12px;color:rgba(255,255,255,.9);display:flex;align-items:center;gap:5px;margin-top:2px}'+
        '#_lw_online::before{content:"";width:7px;height:7px;background:#4ade80;border-radius:50%;display:inline-block}'+
        '#_lw_close{background:none;border:none;color:rgba(255,255,255,.8);font-size:24px;cursor:pointer;line-height:1;padding:0 4px}'+
        '#_lw_close:hover{color:#fff}'+
        '#_lw_social{background:#f0f4ff;padding:10px 14px;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}'+
        '._sc{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;text-decoration:none;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}'+
        '#_lw_msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f7f8fc}'+
        '._bot{background:#fff;color:#1f2937;padding:10px 14px;border-radius:18px 18px 18px 4px;font-size:13px;line-height:1.5;max-width:82%;box-shadow:0 1px 4px rgba(0,0,0,.08);align-self:flex-start}'+
        '._usr{background:linear-gradient(135deg,#0099FF,#A033FF);color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:13px;line-height:1.5;max-width:82%;align-self:flex-end}'+
        '._dots{display:flex;gap:4px;align-items:center;padding:10px 14px;background:#fff;border-radius:18px 18px 18px 4px;align-self:flex-start;box-shadow:0 1px 4px rgba(0,0,0,.08)}'+
        '._dots span{width:7px;height:7px;background:#bbb;border-radius:50%;animation:dot 1.2s infinite}'+
        '._dots span:nth-child(2){animation-delay:.2s}._dots span:nth-child(3){animation-delay:.4s}'+
        '@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}'+
        '#_lw_ftr{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid #e5e7eb;background:#fff;flex-shrink:0}'+
        '#_lw_inp{flex:1;border:1.5px solid #e5e7eb;border-radius:24px;padding:9px 16px;font-size:13px;outline:none;transition:border .2s;background:#f9fafb;color:#111}'+
        '#_lw_inp:focus{border-color:#0099FF;background:#fff}'+
        '#_lw_snd{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0099FF,#A033FF);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}'+
        '#_lw_snd:hover{opacity:.85}#_lw_snd:disabled{opacity:.4;cursor:default}';
      document.head.appendChild(css);

      var wrap = document.createElement('div');
      wrap.id = '_lw';
      wrap.innerHTML =
        '<div id="_lw_panel">'+
          '<div id="_lw_hdr">'+
            '<div id="_lw_ava">LB</div>'+
            '<div id="_lw_info"><strong>Lhvsbeauty</strong><div id="_lw_online">Online now</div></div>'+
            '<button id="_lw_close" title="Close">&times;</button>'+
          '</div>'+
          '<div id="_lw_social">'+
            '<a class="_sc" href="https://m.me/Lhvsbeauty" target="_blank" rel="noopener" style="background:linear-gradient(135deg,#0099FF,#A033FF)">'+
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 4.974 0 11.111c0 3.498 1.744 6.614 4.469 8.654V24l4.088-2.242c1.092.301 2.246.464 3.443.464 6.627 0 12-4.975 12-11.111S18.627 0 12 0zm1.191 14.963l-3.055-3.26-5.963 3.26L10.732 8l3.131 3.26L19.752 8l-6.561 6.963z"/></svg>Messenger</a>'+
            '<a class="_sc" href="https://wa.me/46707383361" target="_blank" rel="noopener" style="background:#25D366">'+
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>WhatsApp</a>'+
            '<a class="_sc" href="https://t.me/linnaYL" target="_blank" rel="noopener" style="background:#229ED9">'+
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>Telegram</a>'+
            '<a class="_sc" href="mailto:luxlinna@gmail.com" style="background:#EA4335">'+
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>Email</a>'+
          '</div>'+
          '<div id="_lw_msgs"></div>'+
          '<div id="_lw_ftr">'+
            '<input id="_lw_inp" type="text" placeholder="Type a message..." maxlength="500">'+
            '<button id="_lw_snd"><svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>'+
          '</div>'+
        '</div>'+
        '<button id="_lw_btn" title="Chat with us">'+
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>'+
        '</button>';
      document.body.appendChild(wrap);

      var panel = document.getElementById('_lw_panel');
      var msgs  = document.getElementById('_lw_msgs');
      var inp   = document.getElementById('_lw_inp');
      var snd   = document.getElementById('_lw_snd');
      var isOpen = false;
      var prompts = [
        'Hi there! 👋 Welcome to Lhvsbeauty. What\'s your name?',
        '',
        'How can we help you today?'
      ];

      function addMsg(text, isUser) {
        var d = document.createElement('div');
        d.className = isUser ? '_usr' : '_bot';
        d.textContent = text;
        msgs.appendChild(d);
        msgs.scrollTop = msgs.scrollHeight;
      }

      function typing(cb) {
        var t = document.createElement('div');
        t.className = '_dots';
        t.innerHTML = '<span></span><span></span><span></span>';
        msgs.appendChild(t);
        msgs.scrollTop = msgs.scrollHeight;
        setTimeout(function(){ msgs.removeChild(t); cb(); }, 800);
      }

      function ask(text) {
        typing(function(){ addMsg(text, false); inp.focus(); });
      }

      function toggle() {
        isOpen = !isOpen;
        panel.classList.toggle('open', isOpen);
        if (isOpen && step === 0) ask(prompts[0]);
        if (isOpen) inp.focus();
      }

      function send() {
        var txt = inp.value.trim();
        if (!txt || inp.disabled) return;
        addMsg(txt, true);
        inp.value = '';

        if (step === 0) {
          visitorName = txt;
          step = 1;
          ask('Nice to meet you, ' + visitorName + '! 😊 What\'s your email or phone so we can follow up with you?');
        } else if (step === 1) {
          visitorContact = txt;
          step = 2;
          ask(prompts[2]);
        } else {
          inp.disabled = true;
          snd.disabled = true;
          fetch(API + '/chat/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({visitor_name: visitorName, visitor_contact: visitorContact, message: txt})
          }).catch(function(){});
          step = 3;
          typing(function(){
            addMsg('Thank you, ' + visitorName + '! 🙏 We\'ve received your message and will reply to ' + visitorContact + ' shortly.', false);
            inp.placeholder = 'Message sent ✓';
          });
        }
      }

      document.getElementById('_lw_btn').addEventListener('click', toggle);
      document.getElementById('_lw_close').addEventListener('click', toggle);
      snd.addEventListener('click', send);
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });
    })();
    </script>
  </body>
</html>
